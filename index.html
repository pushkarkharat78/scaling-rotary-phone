<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>HARSHAD TRADER</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: "Poppins", sans-serif;

            background: #04070b;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;

            position: relative;
        }



        /* ============================================
           BLURRED BACKGROUND IMAGE
        ============================================ */

        .background-image {

            position: fixed;

            inset: -40px;

            background-image: url("background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(11px);

            opacity: 0.40;

            transform: scale(1.15);

            animation: backgroundAnimation 10s ease-in-out infinite alternate;

            pointer-events: none;

            z-index: 0;
        }


        @keyframes backgroundAnimation {

            0% {

                transform: scale(1.15) translate(-4px, -4px);

                opacity: 0.34;
            }


            50% {

                transform: scale(1.19) translate(5px, 4px);

                opacity: 0.44;
            }


            100% {

                transform: scale(1.16) translate(-2px, 5px);

                opacity: 0.38;
            }

        }



        /* DARK OVERLAY */

        .background-overlay {

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at 50% 15%,
                    rgba(0, 190, 255, 0.14),
                    transparent 38%
                ),

                linear-gradient(
                    180deg,
                    rgba(2, 6, 10, 0.50),
                    rgba(2, 5, 9, 0.80) 55%,
                    rgba(2, 4, 7, 0.96)
                );

            pointer-events: none;

            z-index: 1;
        }



        /* ============================================
           AMBIENT CYAN LIGHT
        ============================================ */

        .ambient-glow {

            position: fixed;

            width: 330px;
            height: 330px;

            top: -130px;
            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background: rgba(0, 204, 255, 0.12);

            filter: blur(90px);

            animation: glowMove 7s ease-in-out infinite;

            pointer-events: none;

            z-index: 1;
        }


        @keyframes glowMove {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

                opacity: 0.55;
            }


            50% {

                transform:
                    translateX(-50%)
                    translateY(65px)
                    scale(1.20);

                opacity: 0.88;
            }

        }



        /* ============================================
           MAIN WRAPPER
        ============================================ */

        .page-wrapper {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 410px;

            min-height: 100vh;

            padding:
                max(22px, env(safe-area-inset-top))
                18px
                max(18px, env(safe-area-inset-bottom));

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 17px;

            text-align: center;
        }



        /* ============================================
           TOP BADGE
        ============================================ */

        .top-badge {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 7px 13px;

            border-radius: 100px;

            border: 1px solid rgba(255,255,255,0.10);

            background: rgba(255,255,255,0.055);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 0.5px;

            color: #d0d7df;

            text-transform: uppercase;
        }


        .live-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #25e48b;

            box-shadow:
                0 0 8px #25e48b,
                0 0 14px rgba(37,228,139,0.5);

            animation: liveDot 1.4s infinite;
        }


        @keyframes liveDot {

            0%,
            100% {

                transform: scale(1);

                opacity: 1;
            }


            50% {

                transform: scale(0.65);

                opacity: 0.5;
            }

        }



        /* ============================================
           PREMIUM GLOSSY TITLE BOX
        ============================================ */

        .title-neon-wrapper {

            position: relative;

            width: 100%;

            padding: 2px;

            border-radius: 22px;

            overflow: hidden;

            isolation: isolate;

            box-shadow:

                0 12px 45px rgba(0,0,0,0.42),

                0 0 24px rgba(0,200,255,0.10);
        }



        /* Running neon line */

        .title-neon-wrapper::before {

            content: "";

            position: absolute;

            width: 150%;
            height: 480%;

            left: -25%;
            top: -190%;

            background: conic-gradient(

                from 0deg,

                transparent 0deg,

                transparent 288deg,

                #007cff 303deg,

                #00eaff 316deg,

                #ffffff 327deg,

                #00c8ff 340deg,

                transparent 355deg,

                transparent 360deg
            );

            animation: titleNeonRun 3s linear infinite;

            z-index: -2;
        }



        @keyframes titleNeonRun {

            from {

                transform: rotate(0deg);
            }

            to {

                transform: rotate(360deg);
            }

        }



        /* Actual glossy black card */

        .title-box {

            position: relative;

            overflow: hidden;

            width: 100%;

            padding: 19px 15px;

            border-radius: 20px;

            background:

                linear-gradient(
                    145deg,
                    rgba(24,28,34,0.93),
                    rgba(3,5,8,0.96)
                );

            border: 1px solid rgba(255,255,255,0.07);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:

                inset 0 1px 0 rgba(255,255,255,0.12),

                inset 0 -1px 0 rgba(255,255,255,0.03);
        }



        /* Glass shine on top */

        .title-box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 8%;

            width: 84%;
            height: 45%;

            background:

                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0)
                );

            border-radius: 50%;

            filter: blur(10px);

            pointer-events: none;
        }



        /* moving glossy shine */

        .title-box::after {

            content: "";

            position: absolute;

            top: -80%;

            left: -50%;

            width: 35%;
            height: 260%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.10),
                    transparent
                );

            transform: rotate(20deg);

            animation: titleShine 5s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes titleShine {

            0% {

                left: -50%;
            }

            45%,
            100% {

                left: 125%;
            }

        }



        .main-title {

            position: relative;

            z-index: 2;

            font-size: clamp(25px, 7vw, 31px);

            line-height: 1.17;

            font-weight: 900;

            letter-spacing: -0.8px;

            color: #ffffff;

            text-shadow:

                0 2px 12px rgba(0,0,0,0.65);
        }



        .community-text {

            display: block;

            margin-top: 3px;

            color: #58dded;

            text-shadow:

                0 0 8px rgba(88,221,237,0.30),

                0 0 20px rgba(0,200,255,0.18);
        }



        /* ============================================
           PROFILE AREA
        ============================================ */

        .profile-area {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            margin-top: 2px;
        }



        .avatar-glow {

            width: 92px;
            height: 92px;

            padding: 3px;

            border-radius: 50%;

            background:

                linear-gradient(
                    135deg,
                    #63f1ff,
                    #2aabee,
                    #007ac1
                );

            box-shadow:

                0 0 0 5px rgba(42,171,238,0.05),

                0 0 24px rgba(42,171,238,0.32);
        }



        .profile-img {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid rgba(0,0,0,0.85);

            background: #0b0f14;
        }



        /* UPDATED BRAND */

        .brand-name {

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 0.7px;

            text-transform: uppercase;

            color: #55dce9;

            text-shadow:
                0 0 15px rgba(85,220,233,0.20);
        }



        .mini-description {

            margin-top: -5px;

            font-size: 10.5px;

            font-weight: 500;

            color: #a5afb9;
        }



        /* ============================================
           BENEFIT CARDS
        ============================================ */

        .benefits {

            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 9px;
        }



        .benefit-box {

            min-height: 73px;

            padding: 10px 7px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,0.085);

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 4px;

            box-shadow:

                inset 0 1px 0 rgba(255,255,255,0.04),

                0 8px 30px rgba(0,0,0,0.14);
        }



        .benefit-icon {

            font-size: 18px;
        }


        .benefit-title {

            font-size: 12px;

            font-weight: 700;
        }


        .benefit-sub {

            font-size: 9px;

            color: #9ba6b1;
        }



        /* ============================================
           CTA AREA
        ============================================ */

        .cta-area {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;
        }



        .cta-helper {

            font-size: 11px;

            color: #e5e9ee;

            font-weight: 600;
        }



        /* ============================================
           RUNNING NEON TELEGRAM BORDER
        ============================================ */

        .telegram-neon-wrap {

            position: relative;

            width: 100%;

            padding: 2px;

            border-radius: 15px;

            overflow: hidden;

            isolation: isolate;

            box-shadow:

                0 8px 30px rgba(0,136,204,0.30),

                0 0 18px rgba(0,234,255,0.14);
        }



        .telegram-neon-wrap::before {

            content: "";

            position: absolute;

            width: 150%;
            height: 650%;

            left: -25%;
            top: -275%;

            background:

                conic-gradient(

                    from 0deg,

                    transparent 0deg,

                    transparent 286deg,

                    #007cff 302deg,

                    #00eaff 316deg,

                    #ffffff 328deg,

                    #00bfff 342deg,

                    transparent 358deg
                );

            animation: telegramNeon 2.25s linear infinite;

            z-index: -2;
        }



        @keyframes telegramNeon {

            from {

                transform: rotate(0deg);
            }


            to {

                transform: rotate(360deg);
            }

        }



        .btn-tg {

            position: relative;

            width: 100%;

            min-height: 54px;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 9px;

            padding: 13px 16px;

            border-radius: 13px;

            overflow: hidden;

            text-decoration: none;

            color: #ffffff;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 0.3px;

            background:

                linear-gradient(
                    135deg,
                    #36bdf6,
                    #159edc 45%,
                    #0077b9
                );

            box-shadow:

                inset 0 1px 0 rgba(255,255,255,0.25);

            -webkit-tap-highlight-color: transparent;

            animation: buttonPulse 2s ease-in-out infinite;
        }



        @keyframes buttonPulse {

            0%,
            100% {

                transform: scale(1);
            }


            50% {

                transform: scale(1.018);
            }

        }



        /* Button shine */

        .btn-tg::before {

            content: "";

            position: absolute;

            top: -50%;
            left: -45%;

            width: 30%;
            height: 200%;

            transform: rotate(22deg);

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.34),
                    transparent
                );

            animation: buttonShine 3s ease-in-out infinite;
        }



        @keyframes buttonShine {

            0% {

                left: -45%;
            }


            40%,
            100% {

                left: 130%;
            }

        }



        .btn-tg:active {

            transform: scale(0.97);
        }



        .btn-tg svg {

            position: relative;

            z-index: 2;

            width: 23px;
            height: 23px;

            flex-shrink: 0;

            fill: white;
        }



        .btn-text {

            position: relative;

            z-index: 2;
        }



        .cta-posttext {

            font-size: 10px;

            font-weight: 600;

            color: #9ba6b1;
        }



        /* ============================================
           AKHIL ADS
        ============================================ */

        .ad-branding {

            margin-top: 1px;

            font-size: 9.5px;

            font-weight: 500;

            color: rgba(255,255,255,0.42);
        }



        .ad-branding a {

            text-decoration: none;

            color: rgba(255,255,255,0.72);

            font-weight: 700;

            transition: 0.2s;
        }



        .ad-branding a:hover {

            color: #40d8ef;
        }



        /* ============================================
           SMALL HEIGHT PHONES
        ============================================ */

        @media (max-height: 670px) {

            .page-wrapper {

                gap: 11px;

                padding-top: 13px;

                padding-bottom: 13px;
            }


            .title-box {

                padding: 14px 12px;
            }


            .main-title {

                font-size: 22px;
            }


            .avatar-glow {

                width: 72px;

                height: 72px;
            }


            .brand-name {

                font-size: 15px;
            }


            .benefit-box {

                min-height: 60px;

                padding: 7px 5px;
            }


            .btn-tg {

                min-height: 47px;

                font-size: 13px;

                padding: 10px 12px;
            }

        }



        /* VERY SMALL PHONES */

        @media (max-width: 350px) {

            .page-wrapper {

                padding-left: 14px;

                padding-right: 14px;
            }


            .main-title {

                font-size: 21px;
            }


            .brand-name {

                font-size: 14px;
            }


            .btn-tg {

                font-size: 12.5px;
            }

        }



        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {

            .background-image,

            .ambient-glow,

            .live-dot,

            .title-neon-wrapper::before,

            .title-box::after,

            .telegram-neon-wrap::before,

            .btn-tg,

            .btn-tg::before {

                animation: none;
            }

        }

    </style>

</head>
